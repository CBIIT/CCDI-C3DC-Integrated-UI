- page: '/about'
  title: "About"
  content:
    - paragraph: "About the Childhood Cancer Clinical Data Commons"
    - paragraph: "Childhood Cancer Data Initiative"
    - paragraph: "The NCI’s Childhood Cancer Data Initiative (CCDI), which the Childhood Cancer Clinical Data Commons is part of, is an initiative seeking to build a community centered around childhood cancer care and research. Through enhanced data sharing, the initiative works to improve understanding of cancer biology, preventive measures, treatment, quality of life, and survivorship, as well as ensure that the community can learn from every child with cancer. C3DC is part of the CCDI Data Ecosystem. Learn more about other CCDI data and resources on the CCDI Hub. Sign-up for email updates from NCI about CCDI."
    - paragraph: "Childhood Cancer Clinical Data Commons"
    - paragraph: "The Childhood Cancer Clinical Data Commons (C3DC) is an open-access web application that serves as the primary source for deidentified, individual-level harmonized data that describes the demographic and phenotypic characteristics of participants. This harmonization process uses a standard data dictionary consisting of Common Data Elements (CDEs), C3DC employs a common data model to facilitate cohort analyses and correlative analytics with data in other datatype-specific commons. The data model has been deposited in GitHub."
    - paragraph: "The C3DC offers several key features:"
    - paragraph: "Allows researchers to search for harmonized participant-level clinical data collected from multiple studies."
    - paragraph: "Facilitates longitudinal data analyses."
    - paragraph: "Enables custom/synthetic cohort creation and data downloading for subsequent local analyses."
    - paragraph: "Citing the C3DC"
    - paragraph: "NCI expects users to acknowledge CCDI data use as follows:"
    - paragraph: "The results published here are, in whole or in part, derived from the analysis of data listed in the C3DC (clinicalcommons.ccdi.cancer.gov), established by the National Cancer Institute’s Childhood Cancer Data Initiative (CCDI)."
    - paragraph: "To cite individual studies, note the CCDI study ID (e.g., phs002790) and include the name and URL or link for the C3DC (clinicalcommons.ccdi.cancer.gov), along with the phrase, established by the National Cancer Institute’s Childhood Cancer Data Initiative (CCDI)."
    - paragraph: "Example: The results analyzed and <published or shown> here are based in whole or in part from analyzing the Molecular Characterization Initiative data listed in the C3DC (clinicalcommons.ccdi.cancer.gov) under study ID phs002790. The data were accessed from the NCI’s Cancer Research Data Commons (datacommons.cancer.gov). The C3DC was established by the National Cancer Institute’s Childhood Cancer Data Initiative (CCDI)."
    - paragraph: "Questions for C3DC?"
    - paragraph: "The Childhood Cancer Data Initiative (CCDI) welcomes community input to improve this web application usability. Please send your feedback and suggestions to ncichildhoodcancerdatainitiative@mail.nih.gov. Your contributions are valuable to enhancing the user experience."
